<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <rect width="64" height="64" rx="14" fill="#1e3a5f"/>
  <rect x="2" y="2" width="60" height="60" rx="12" fill="url(#bg)" stroke="url(#border)" stroke-width="1.5"/>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="64" y2="64">
      <stop offset="0%" stop-color="#1e40af"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="border" x1="0" y1="0" x2="64" y2="64">
      <stop offset="0%" stop-color="#3b82f6" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#3b82f6" stop-opacity="0.1"/>
    </linearGradient>
  </defs>
  <!-- Desk surface -->
  <rect x="14" y="30" width="36" height="6" rx="2" fill="#3b82f6" opacity="0.9"/>
  <!-- Desk front -->
  <rect x="14" y="36" width="36" height="10" rx="1" fill="#1e40af" opacity="0.7"/>
  <!-- Legs -->
  <rect x="17" y="46" width="3" height="6" rx="1" fill="#1e40af" opacity="0.8"/>
  <rect x="44" y="46" width="3" height="6" rx="1" fill="#1e40af" opacity="0.8"/>
  <!-- Laptop screen -->
  <rect x="22" y="16" width="20" height="14" rx="2" fill="#60a5fa" opacity="0.85"/>
  <!-- Screen lines -->
  <rect x="25" y="20" width="14" height="2" rx="1" fill="#dbeafe" opacity="0.5"/>
  <rect x="25" y="24" width="10" height="2" rx="1" fill="#dbeafe" opacity="0.3"/>
  <!-- Laptop base -->
  <rect x="20" y="30" width="24" height="2" rx="1" fill="#93c5fd" opacity="0.6"/>
</svg>
